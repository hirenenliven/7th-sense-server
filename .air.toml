root = "."
tmp_dir = "tmp"

[build]
  # 32-bit build: the CNC DLL is x86, and the server loads it to collect machine data
  cmd = "set GOARCH=386&& go build -o ./tmp/server.exe ./cmd/server"
  entrypoint = ["./tmp/server.exe"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", ".git", "logs"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = false
  kill_delay = "1s"

[log]
  time = true

[misc]
  clean_on_exit = true
