  securitySchemes:
    cookieAuth:
      description: HttpOnly session cookie set by POST /v1/auth/login and cleared by POST /v1/auth/logout.
      in: cookie
      name: ts_session
      type: apiKey
info:
  contact: {}
  description: |-
    REST API of the 7th Sense CNC monitoring platform. Every response is a JSON envelope {statusCode, success, message, data}.
    Log in with POST /v1/auth/login: the server sets the HttpOnly session cookie ts_session, which every other call sends.
  title: 7th Sense API
  version: "1.0"
openapi: 3.0.3
paths:
  /v1/auth/login:
    post:
      description: |-
        Checks the credentials and starts a session. deviceInfo (the browser's user agent) is stored with the session for auditing.
        Validation: Invalid username or password; Please enter username; Please enter password.

        Used by pages: Login
      operationId: login
      requestBody:
        content:
          application/json:
            example:
              password: Postman sample
              remember: false
              username: Postman sample
            schema:
              $ref: '#/components/schemas/dto.LoginRequest'
        description: Request body
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                message: success
                statusCode: 200
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/response.Envelope'
                  - properties:
                      data:
                        type: object
                    type: object
          description: OK
        "400":
          content:
            application/json:
              example:
                message: Validation error
                statusCode: 400
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Validation error
        "401":
          content:
            application/json:
              example:
                message: Invalid username or password
                statusCode: 401
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Invalid username or password
        "403":
          content:
            application/json:
              example:
                message: Account inactive
                statusCode: 403
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Account inactive
        "429":
          content:
            application/json:
              example:
                message: Too many login attempts
                statusCode: 429
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Too many login attempts
        "500":
          content:
            application/json:
              example:
                message: Server error
                statusCode: 500
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Server error
      summary: Login
      tags:
        - Auth
  /v1/auth/login-as:
    post:
      description: |-
        Starts a session of the customer for the superadmin, in a new browser tab. The session cookie (HttpOnly) is scoped to /api/as/{sessionKey}: that tab calls /api/as/{sessionKey}/v1/... instead of /api/v1/..., so logging out of either tab never ends the other session. The session records the superadmin (auth_tokens.impersonated_by) and lasts one working day.
        Roles: superadmin (others get 403).
        Validation: Please select customer; Customer not found (missing, deleted or not a customer); Account inactive.

        Used by pages: Customers (tab)
      operationId: loginAs
      requestBody:
        content:
          application/json:
            example:
              customerId: 1
            schema:
              $ref: '#/components/schemas/dto.LoginAsRequest'
        description: Request body
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                message: success
                statusCode: 200
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/response.Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/dto.LoginAsResponse'
                    type: object
          description: OK
        "400":
          content:
            application/json:
              example:
                message: Validation error
                statusCode: 400
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Validation error
        "401":
          content:
            application/json:
              example:
                message: Not logged in
                statusCode: 401
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Not logged in
        "403":
          content:
            application/json:
              example:
                message: Role not allowed or account inactive
                statusCode: 403
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Role not allowed or account inactive
        "404":
          content:
            application/json:
              example:
                message: Customer not found
                statusCode: 404
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Customer not found
        "500":
          content:
            application/json:
              example:
                message: Server error
                statusCode: 500
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Server error
      security:
        - cookieAuth: []
      summary: Log in as customer
      tags:
        - Auth
  /v1/auth/logout:
    post:
      description: |-
        Ends the session of token. An unknown or empty token is not an error. Called as /api/as/{key}/v1/auth/logout it ends only that "log in as" session.

        Used by pages: App shell (session, logout, theme)
      operationId: logout
      responses:
        "200":
          content:
            application/json:
              example:
                message: success
                statusCode: 200
                success: true
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: OK
        "401":
          content:
            application/json:
              example:
                message: Not logged in
                statusCode: 401
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Not logged in
        "500":
          content:
            application/json:
              example:
                message: Server error
                statusCode: 500
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Server error
      summary: Logout
      tags:
        - Auth
  /v1/branches:
    get:
      description: |-
        Returns the branches. A non-nil userCityID keeps only that city's branches.

        Used by pages: Add / edit customer or user, Branches, Locations
      operationId: getBranches
      parameters:
        - description: User city id
          in: query
          name: userCityId
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                message: success
                statusCode: 200
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/response.Envelope'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/model.Branch'
                        type: array
                    type: object
          description: OK
        "400":
          content:
            application/json:
              example:
                message: Validation error
                statusCode: 400
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Validation error
        "401":
          content:
            application/json:
              example:
                message: Not logged in
                statusCode: 401
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Not logged in
        "500":
          content:
            application/json:
              example:
                message: Server error
                statusCode: 500
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Server error
      security:
        - cookieAuth: []
      summary: Get branches
      tags:
        - Branches
    post:
      description: |-
        Adds a branch. A city, when given, must be one of the branch customer's cities.
        Roles: superadmin only (others get 403).

        Used by pages: Add / edit branch
      operationId: createBranch
      requestBody:
        content:
          application/json:
            example:
              address: Postman sample
              code: Postman sample
              colorCode: Postman sample
              customerId: 1
              email: Postman sample
              gstNumber: Postman sample
              name: Postman sample
              panNumber: Postman sample
              status: Postman sample
              userCityId: 1
            schema:
              $ref: '#/components/schemas/dto.CreateBranchRequest'
        description: Request body
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                message: created
                statusCode: 201
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/response.Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/model.Branch'
                    type: object
          description: Created
        "400":
          content:
            application/json:
              example:
                message: Validation error
                statusCode: 400
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Validation error
        "401":
          content:
            application/json:
              example:
                message: Not logged in
                statusCode: 401
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Not logged in
        "403":
          content:
            application/json:
              example:
                message: Role not allowed
                statusCode: 403
                success: false
              schema:
                $ref: '#/components/schemas/response.Envelope'
          description: Role not allowed
        "500":
          content:
            application/json:
              example:
                message: Server error
                statusCode: 500
