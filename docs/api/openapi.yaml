components:
  schemas:
    dto.CreateBranchRequest:
      properties:
        address:
          type: string
        code:
          type: string
        colorCode:
          type: string
        customerId:
          type: integer
        email:
          type: string
        gstNumber:
          type: string
        name:
          type: string
        panNumber:
          type: string
        status:
          type: string
        userCityId:
          type: integer
      type: object
    dto.CreateBrandRequest:
      properties:
        code:
          type: string
        description:
          type: string
        name:
          type: string
      type: object
    dto.CreateBreakRequest:
      properties:
        endTime:
          description: '"HH:MM"; not after start = past midnight'
          type: string
        name:
          type: string
        shiftId:
          description: one of the customer's shifts; nil = no shift yet
          type: integer
        startTime:
          description: '"HH:MM"'
          type: string
        userId:
          description: customer the break belongs to
          type: integer
      type: object
    dto.CreateClienteleRequest:
      properties:
        address:
          type: string
        city:
          type: string
        clientCode:
          type: string
        contactNumber:
          type: string
        countryName:
          description: e.g. "India"
          type: string
        email:
          description: optional
          type: string
        name:
          type: string
        stateName:
          description: e.g. "Gujarat"
          type: string
        userId:
          description: customer the client belongs to
          type: integer
      type: object
    dto.CreateControllerRequest:
      properties:
        brandId:
          type: integer
        description:
          type: string
        name:
          type: string
      type: object
    dto.CreateDowntimeReasonRequest:
      properties:
        reason:
          type: string
        reasonCode:
          description: optional
          type: string
        userId:
          description: customer the reason belongs to
          type: integer
      type: object
    dto.CreateHolidayRequest:
      properties:
        endDate:
          description: '"YYYY-MM-DD", holiday only'
          type: string
        holidayType:
          description: HolidayTypeHoliday or HolidayTypeWeekOff
          type: string
        name:
          type: string
        startDate:
          description: '"YYYY-MM-DD", holiday only'
          type: string
        userId:
          description: customer the holiday belongs to
          type: integer
        weekDay:
          description: 1 (Mon) … 7 (Sun), week off only
          type: integer
      type: object
    dto.CreateIdleReasonRequest:
      properties:
        reason:
          type: string
        reasonCode:
          description: optional
          type: string
        userId:
          description: customer the reason belongs to
          type: integer
      type: object
    dto.CreateLicenceKeysRequest:
      properties:
        licenceKeys:
          items:
            $ref: '#/components/schemas/dto.NewLicenceKey'
          type: array
        userId:
          description: customer the keys belong to
          type: integer
      type: object
    dto.CreateMachineRequest:
      properties:
        accuracyId:
          type: integer
        amc:
          type: string
        billDate:
          description: optional
          type: string
        brandId:
          type: integer
        controllerId:
          type: integer
        controllerVersion:
          type: string
        controllerVersionType:
          type: integer
        healthIds:
          type: string
        hourlyCost:
          type: string
        installationDate:
          type: string
        isInsured:
          type: boolean
        latitude:
          type: string
        lineId:
          description: one of the customer's lines (user_line)
          type: integer
        liveIp:
          type: string
        localIp:
          description: Data access
          type: string
        longitude:
          type: string
        machineSystemType:
          type: string
        maintenanceRequired:
          type: boolean
        modelId:
          description: a model of the controller (models table)
          type: integer
        name:
          type: string
        password:
          type: string
        port:
          type: integer
        securityMode:
          type: string
        serialNumber:
          type: string
        userId:
          description: Machine details
          type: integer
        username:
          type: string
        warrantyDate:
          description: optional
          type: string
      type: object
    dto.CreatePartRequest:
      properties:
        clienteleId:
          description: optional; no clientele table yet
          type: integer
        partCount:
          type: integer
        partName:
          type: string
        partNo:
          type: string
        processes:
          items:
            $ref: '#/components/schemas/dto.PartProcessFields'
          type: array
        userId:
          description: customer that owns the part
          type: integer
      type: object
    dto.CreateProductionScheduleRequest:
      properties:
        endDate:
          description: ignored for a single day
          type: string
        items:
          items:
            $ref: '#/components/schemas/dto.ProductionScheduleItemFields'
          type: array
        machineId:
          description: a machine of the customer
          type: integer
        scheduleType:
          type: string
        startDate:
          type: string
        userId:
          description: customer that owns the schedule
          type: integer
      type: object
    dto.CreateShiftRequest:
      properties:
        breakIds:
          description: the customer's breaks (POST /breaks)
          items:
            type: integer
          type: array
        endTime:
          description: '"HH:MM"; not after start = past midnight'
          type: string
        name:
          type: string
        shiftType:
          description: ShiftTypeDay or ShiftTypeNight
          type: string
        startTime:
          description: '"HH:MM"'
          type: string
        userId:
          description: customer the shift belongs to
          type: integer
        workingDays:
          description: ISO weekdays 1 (Mon) … 7 (Sun)
          items:
            type: integer
          type: array
      type: object
