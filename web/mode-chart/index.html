<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine Mode Chart</title>
  <style>
    :root {
      --bg: #14171c;
      --panel: #1a1e24;
      --border: #2a2f37;
      --text: #d7dbe0;
      --muted: #8b939e;
      --accent: #f28c28;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 "Segoe UI", Roboto, Arial, sans-serif;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .toolbar label { color: var(--muted); }
    input, select, button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font: inherit;
    }
    input[type="number"] { width: 110px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
    .divider { width: 1px; height: 24px; background: var(--border); }
    .machine-name { color: var(--accent); font-size: 18px; font-weight: 600; }
    .info { color: var(--muted); }
    .info strong { color: var(--text); font-weight: 600; }
    .selected-period {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      white-space: nowrap;
    }
    .swatch { display: inline-block; width: 6px; height: 18px; border-radius: 3px; }
    .status { padding: 8px 16px; color: var(--muted); }
    .status.error { color: #f87171; }
    #chart { width: 100%; height: 520px; }
    section { padding: 0 16px 24px; }
    h2 { font-size: 15px; font-weight: 600; margin: 20px 0 10px; }
    .totals { display: flex; flex-wrap: wrap; gap: 8px; }
    .total {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: var(--panel); color: var(--muted); font-weight: 600; position: sticky; top: 0; }
    tbody tr:hover { background: #20252c; }
    td.number { font-variant-numeric: tabular-nums; }
    .mode-cell { display: flex; align-items: center; gap: 8px; }
    .running { color: var(--accent); }
  </style>
</head>
<body>
  <div class="toolbar">
    <label for="machine-id">Machine ID</label>
    <input id="machine-id" type="number" min="1" placeholder="e.g. 195">
    <button id="load" class="primary">Load</button>
    <div class="divider"></div>
    <select id="range" aria-label="Time range">
      <option value="30">Last 30 minutes</option>
      <option value="60">Last 1 hour</option>
      <option value="480">Last 8 hours</option>
      <option value="1440">Last 24 hours</option>
      <option value="4320">Last 3 days</option>
      <option value="14400" selected>Last 10 days</option>
    </select>
    <button id="zoom-out" title="Zoom out">&minus;</button>
    <button id="zoom-in" title="Zoom in">+</button>
    <div class="divider"></div>
    <span class="machine-name" id="machine-name">—</span>
    <span class="info">Program Name: <strong id="program-name">—</strong></span>
    <span class="info">Mode: <strong id="current-mode">—</strong></span>
    <div class="selected-period" id="selected-period" hidden></div>
  </div>

  <div class="status" id="status">Enter a machine ID and press Load.</div>
  <div id="chart"></div>

  <section>
    <h2>Time per mode</h2>
    <div class="totals" id="totals"></div>

    <h2>Mode list <span class="info" id="period-count"></span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Mode ID</th>
            <th>Mode</th>
            <th>Program</th>
            <th>Start</th>
            <th>End</th>
            <th>Duration</th>
          </tr>
        </thead>
        <tbody id="period-rows"></tbody>
      </table>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="mode-chart.js"></script>
</body>
</html>
